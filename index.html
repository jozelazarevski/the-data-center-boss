<title>The Data Center Boss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed isometric campus, glass ops cards floating on its edges (stacked below the map on phones).
   Deliberately a single light, daylight look like a scale model on a desk. */
:root {
  color-scheme: light;
  --bg: #e9edf7;
  --panel: rgba(255, 255, 255, 0.94);
  --panel-solid: #ffffff;
  --ink: #121a33;
  --muted: #69738d;
  --faint: #a3abc0;
  --line: #e4e8f2;
  --wash: #f3f5fb;
  --accent: #2f5bea;
  --accent-ink: #1f45c7;
  --accent-wash: #e8eeff;
  --good: #16935f;
  --good-wash: #e2f6ec;
  --warn: #b7780a;
  --warn-wash: #fdf1d6;
  --bad: #d23f45;
  --bad-wash: #fde7e7;
  --shadow: 0 1px 2px rgba(18, 26, 51, 0.06), 0 8px 24px rgba(30, 50, 110, 0.10);
  --font-ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 500 13px/1.4 var(--font-ui); font-variant-numeric: tabular-nums;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }
.mono { font-family: var(--font-data); font-weight: 500; letter-spacing: -0.01em; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 10px 16px;
  background: var(--panel-solid); border-bottom: 1px solid var(--line); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; white-space: nowrap; }
.search {
  flex: 1; max-width: 400px; min-width: 0; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--panel-solid); color: var(--muted);
}
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font: inherit; color: var(--ink); }
.search kbd { font: 600 11px var(--font-data); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--muted); }
.spacer { flex: 1; }
.site-chip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px 5px 6px; white-space: nowrap; }
.site-code { background: var(--accent); color: #fff; font: 600 11px var(--font-data); border-radius: 6px; padding: 5px 6px; }
.site-chip b { display: block; font-size: 12.5px; }
.site-chip small, .me small { display: block; color: var(--muted); font-size: 11px; }
.live { display: flex; align-items: center; gap: 6px; background: var(--good-wash); color: var(--good); border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(22,147,95,.18); }
.live span { color: var(--ink); font-family: var(--font-data); }
.bell { position: relative; border: 0; background: transparent; padding: 6px; border-radius: 8px; color: var(--ink); }
.bell:hover { background: var(--wash); }
.badge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; }
.me { display: flex; align-items: center; gap: 9px; padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; }
.me b { display: block; font-size: 12.5px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #6f8cff); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 11px; }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-height: 0; }
.canvas-wrap { position: absolute; inset: 0; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.pointing { cursor: pointer; }

.panel { background: var(--panel); border: 1px solid rgba(255,255,255,.7); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(10px); }

.kpis { position: absolute; top: 16px; left: 16px; display: flex; gap: 12px; z-index: 2; max-width: calc(100% - 420px); overflow-x: auto; padding-bottom: 4px; }
.kpi { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; min-width: 176px; }
.kpi .ico, .ico-tile { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; flex: none; }
.kpi label { display: block; font-size: 11.5px; color: var(--ink); font-weight: 600; }
.kpi .val { display: flex; align-items: baseline; gap: 6px; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.kpi .val small { font-size: 12px; color: var(--muted); font-weight: 600; }
.delta { font-size: 11px; font-weight: 700; color: var(--good); }
.delta.down { color: var(--bad); }
.kpi .sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; }

.mapctl { position: absolute; top: 16px; right: 372px; z-index: 2; display: flex; flex-direction: column; padding: 4px; gap: 2px; }
.mapctl button { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; color: var(--ink); }
.mapctl button:hover { background: var(--wash); }
.mapctl hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }

.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--panel-solid); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 11px; min-width: 170px; font-size: 12px; border: 1px solid var(--line); }
.tip b { font-family: var(--font-data); font-size: 12.5px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
.tip .row span:last-child { color: var(--ink); font-weight: 700; }
.tip .hint { margin-top: 6px; color: var(--accent); font-weight: 700; }

.toasts { position: absolute; z-index: 6; top: 96px; left: 50%; transform: translateX(-60%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { display: flex; align-items: center; gap: 9px; background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 14px 8px 10px; font-weight: 600; font-size: 12.5px; box-shadow: var(--shadow); animation: tin .25s ease-out; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: #6f8cff; flex: none; }
.toast.good i { background: #3ddc97; } .toast.warn i { background: #f7b733; } .toast.bad i { background: #ff6b6b; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }

/* ---------- site panel ---------- */
.site { position: absolute; top: 16px; right: 16px; width: 340px; z-index: 2; max-height: calc(100% - 236px); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.site-head { display: flex; gap: 11px; align-items: center; }
.eyebrow { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.site-head h2 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
.site-head p { margin: 0; font-size: 11.5px; color: var(--muted); }
.status-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.chip.good { background: var(--good-wash); color: var(--good); }
.chip.warn { background: var(--warn-wash); color: var(--warn); }
.chip.bad { background: var(--bad-wash); color: var(--bad); }
.chip.info { background: var(--accent-wash); color: var(--accent-ink); }
.chip.idle { background: var(--wash); color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--wash); border-radius: 10px; padding: 9px 10px; min-width: 0; }
.tile label { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.tile .v small { font-size: 11px; color: var(--muted); font-weight: 600; }
.bar { height: 5px; border-radius: 3px; background: #dfe4f0; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s; }
.bar.good > i { background: var(--good); } .bar.warn > i { background: #e3a21a; } .bar.bad > i { background: var(--bad); }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 12px; margin-bottom: 4px; }
.sec-title span { font-weight: 600; color: var(--muted); font-size: 11px; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .qty { font-weight: 800; width: 34px; text-align: right; }
.part-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--wash); color: var(--accent); flex: none; }
.selected-rack { border: 1px solid var(--line); border-radius: 12px; padding: 11px; display: flex; flex-direction: column; gap: 8px; }
.selected-rack .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.selected-rack .top b { font-family: var(--font-data); font-size: 14px; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kv div { background: var(--wash); border-radius: 8px; padding: 6px 8px; }
.kv label { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.kv span { font-weight: 800; }
.btn { border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { background: var(--accent-wash); color: var(--accent-ink); }
.btn.ghost:hover { background: #dbe4ff; }
.btn:disabled { background: var(--wash); color: var(--faint); cursor: not-allowed; }
.btn.sm { padding: 5px 9px; font-size: 11px; border-radius: 7px; }

/* ---------- deployment tracker ---------- */
.deploy { position: absolute; left: 16px; bottom: 16px; z-index: 2; width: min(800px, calc(100% - 440px)); padding: 14px 16px; display: flex; gap: 16px; align-items: stretch; }
.deploy .track { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.deploy .track-head { display: flex; justify-content: space-between; gap: 10px; }
.deploy .track-head b { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.deploy .track-head span { color: var(--muted); font-size: 11px; }
.stages { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.stage-node { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; position: relative; }
.stage-node::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 2px; background: #dfe4f0; z-index: 0; }
.stage-node:first-child::before { display: none; }
.stage-node.done::before, .stage-node.now::before { background: var(--accent); }
.dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--wash); color: var(--faint); border: 2px solid #dfe4f0; position: relative; z-index: 1; }
.done .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.now .dot { background: #fff; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px rgba(47,91,234,.15); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(47,91,234,.06); } }
.stage-node b { font-size: 11.5px; font-weight: 700; }
.stage-node small { font-size: 10.5px; color: var(--muted); font-family: var(--font-data); }
.order-card { width: 250px; flex: none; background: var(--wash); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; }
.order-card .oid { font-family: var(--font-data); font-weight: 600; font-size: 13px; }
.order-card p { margin: 0; font-size: 11.5px; color: var(--muted); }
.order-card .btn { margin-top: auto; }

/* ---------- ops tabs ---------- */
.ops { position: absolute; right: 16px; bottom: 16px; width: 380px; z-index: 2; padding: 10px 12px 8px; }
.tabs { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 12px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--panel-solid); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(18,26,51,.08); }
.tab em { font-style: normal; color: var(--faint); margin-left: 3px; }
.tab.alert em { color: var(--bad); }
.tabs .spacer + span { font-size: 11px; color: var(--muted); }
.ops-body { max-height: 150px; overflow-y: auto; }
.ops .li { padding: 6px 0; font-size: 12px; }
.ops .li .id { font-family: var(--font-data); font-weight: 600; width: 46px; flex: none; }
.ops .li .sub { color: var(--muted); font-size: 11px; display: block; }
.mini-bar { width: 52px; flex: none; }
.empty { color: var(--muted); font-size: 12px; padding: 14px 0; text-align: center; }
.crew-av { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 9.5px; font-weight: 800; display: grid; place-items: center; flex: none; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .site { width: 300px; }
  .ops { width: 330px; }
  .mapctl { right: 332px; }
  .deploy { width: calc(100% - 378px); }
  .order-card { width: 200px; }
  .kpis { max-width: calc(100% - 380px); }
  .me div, .site-chip div { display: none; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .topbar { flex-wrap: wrap; gap: 10px; }
  .search { order: 5; flex-basis: 100%; max-width: none; }
  .site-chip, .me { display: none; }
  .stage { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px; }
  .canvas-wrap { position: relative; inset: auto; height: 62vh; min-height: 380px; margin: 0 -16px; }
  .kpis { top: 12px; left: 12px; right: 12px; max-width: none; }
  .kpi { min-width: 150px; padding: 9px 12px 9px 9px; }
  .kpi .ico { width: 32px; height: 32px; }
  .kpi .val { font-size: 17px; }
  .mapctl { top: auto; bottom: 12px; right: 12px; flex-direction: row; }
  .mapctl hr { border-top: 0; border-left: 1px solid var(--line); margin: 4px 3px; }
  .site, .deploy, .ops { position: static; width: auto; max-height: none; }
  .deploy { flex-direction: column; }
  .order-card { width: auto; }
  .stage-node b { font-size: 10.5px; }
  .stage-node small { font-size: 9.5px; }
  .ops-body { max-height: none; }
  .toasts { top: 70px; transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .now .dot { animation: none; }
  .toast { animation: none; }
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><span id="logo"></span>Data Center Boss</div>
    <label class="search" for="search">
      <span data-icon="search"></span>
      <input id="search" type="search" autocomplete="off" placeholder="Find a rack, crew or delivery (try D03)">
      <kbd>/</kbd>
    </label>
    <div class="spacer"></div>
    <div class="site-chip"><span class="site-code">DC-01</span><div><b>Ashburn Campus</b><small id="siteSub">70% full</small></div></div>
    <div class="live"><i></i>Live <span id="clock">09:40</span></div>
    <button class="bell" id="bell" data-act="alerts" aria-label="Show alerts"><span data-icon="bell"></span><span class="badge" id="bellBadge" hidden>0</span></button>
    <div class="me"><span class="avatar">YOU</span><div><b>You</b><small>Site Boss</small></div></div>
  </header>

  <main class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="scene" aria-label="Isometric view of the data center campus. Click a rack to inspect it, or an alert pin to send a technician."></canvas>
      <section class="kpis" id="kpis" aria-label="Key figures"></section>
      <div class="mapctl panel" aria-label="Map controls">
        <button data-act="zoomin" aria-label="Zoom in"><span data-icon="plus"></span></button>
        <button data-act="zoomout" aria-label="Zoom out"><span data-icon="minus"></span></button>
        <hr>
        <button data-act="rotl" aria-label="Rotate left"><span data-icon="rotl"></span></button>
        <button data-act="rotr" aria-label="Rotate right"><span data-icon="rotr"></span></button>
        <button data-act="home" aria-label="Reset view"><span data-icon="home"></span></button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>

    <aside class="site panel" aria-label="Site details">
      <div class="site-head">
        <div class="ico-tile"><span data-icon="building"></span></div>
        <div style="flex:1;min-width:0">
          <div class="eyebrow">Campus · DC-01</div>
          <h2>Ashburn Campus</h2>
          <p>21 Loudoun Tech Dr, Ashburn VA</p>
        </div>
      </div>
      <div class="status-line" id="statusLine"></div>
      <div class="tiles" id="tiles"></div>
      <div id="rackCard"></div>
      <div>
        <div class="sec-title">Spare parts <span>units on site</span></div>
        <div class="list" id="spares"></div>
      </div>
    </aside>

    <section class="deploy panel" aria-label="Rack deployment" id="deploy"></section>

    <section class="ops panel" aria-label="Operations">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="ops-body" id="opsBody"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

const hhmm = m => { m = Math.floor(m) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };

/* ---------------- icons ---------------- */

const ICON = {

  gauge: P('<path d="M12 14 16 9"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>', 20),
  shield: P('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/>', 20),
  wallet: P('<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3h-5a2 2 0 0 0 0 4h5v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/>', 20),
  building: P('<path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-5h6v5M9 11h.01M15 11h.01"/>', 20),
  order: P('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>', 14),

function walk(c, dt) {
  if (!c.path.length) return true;
  const p = c.path[0], pos = c.g.position;
  const dx = p.x - pos.x, dz = p.z - pos.z, d = Math.hypot(dx, dz), s = 2.8 * dt;
  if (d > 0.001) c.g.rotation.y = Math.atan2(dx, dz);
  if (d <= s) { pos.x = p.x; pos.z = p.z; c.path.shift(); } else { pos.x += dx / d * s; pos.z += dz / d * s; }
  return c.path.length === 0;
}

function toast(text, kind = "") {

function liveRacks() { return racks.filter(r => r.status === "live"); }

function spawnIncident(forceType) {
  const open = S.incidents.length;
  if (open >= 4) return;
  const candidates = liveRacks().filter(r => !r.incident);
  if (!candidates.length) return;
  const rack = pick(candidates);
  const key = forceType || pick(["hot", "hot", "psu", "node", "link"]);
  const type = INC[key];
  const inc = { id: "INC-" + String(S.incSeq++).padStart(3, "0"), key, type, rack, sev: type.sev, detail: type.detail(), t0: S.t, clock0: S.clock, state: "open", crew: null, breached: false };
  inc.pin = makePin(SEV[inc.sev]); inc.pin.position.set(rack.x, 2.4, rack.z);
  inc.pin.userData.hit.forEach(h => h.userData.incident = inc);
  rack.incident = inc;
  if (key === "hot") rack.inlet = rand(33, 37);

}

function dispatch(inc) {
  if (!inc || inc.state !== "open") return;
  const idle = crews.filter(c => c.state === "idle" || c.state === "return");
  if (!idle.length) { inc.queued = true; toast(`Both crews are busy. ${inc.rack.id} is next in line.`); return; }
  const c = idle.sort((a, b) => dist(a, inc.rack) - dist(b, inc.rack))[0];
  assign(c, inc);
}
const dist = (c, r) => Math.abs(c.g.position.x - r.x) + Math.abs(c.g.position.z - r.aisle);
function assign(c, inc) {
  inc.state = "assigned"; inc.crew = c; inc.queued = false;
  c.job = inc; c.state = "route";
  const pos = c.g.position;
  c.path = [{ x: LANE_X, z: pos.z }, { x: LANE_X, z: inc.rack.aisle }, { x: inc.rack.x, z: inc.rack.aisle }];
  toast(`${c.name.split(" ")[0]} is heading to ${inc.rack.id}.`);
}
function resolve(inc) {
  const r = inc.rack;
  r.incident = null; r.inlet = rand(22, 25);
  scene.remove(inc.pin);
  S.incidents = S.incidents.filter(i => i !== inc);
  S.rep = clamp(S.rep + (inc.breached ? 1 : 3), 0, 100);
  S.resolved++;
  toast(`${r.id} fixed. ${inc.usedSpare ? SPARES[inc.type.part].name + " swapped." : "Patched without a spare."}`, "good");
}

function placeOrder() {
  if (S.order) return;
  const dark = racks.filter(r => r.status === "dark");
  if (dark.length < 4) { toast("Hall B is full. Every rack position is in use."); return; }
  if (S.budget < ORDER_COST) { toast(`You need ${money(ORDER_COST)} for 4 racks. You have ${money(S.budget)}.`, "warn"); return; }
  S.budget -= ORDER_COST;
  S.order = { id: "DEP-" + S.orderSeq++, racks: dark.slice(0, 4), stage: 0, times: [S.clock], stageT: S.t };
  toast(`${S.order.id} placed: 4 GPU racks for Row ${S.order.racks[0].row.n}.`);
}
function onTruckDocked() {
  const o = S.order; if (!o || o.stage !== 1) return;
  o.stage = 2; o.times[2] = S.clock; o.stageT = S.t;
  dockCrates.visible = true;
  SPARES.psu.qty += 2; SPARES.fan.qty += 2; SPARES.optic.qty += 3; SPARES.gpu.qty += 1;
  toast(`${o.id} unloaded at bay 2. Spares restocked too.`, "good");
}
function tickOrder() {
  const o = S.order; if (!o) return;
  const since = S.t - o.stageT;
  if (o.stage === 0 && since > STAGE_EST[0]) { o.stage = 1; o.times[1] = S.clock; o.stageT = S.t; truck.start(); }
  else if (o.stage === 2 && since > STAGE_EST[2]) {
    o.stage = 3; o.times[3] = S.clock; o.stageT = S.t;
    dockCrates.visible = false; truck.phase = "out";
    o.racks.forEach(r => setRackStatus(r, "install"));
  } else if (o.stage === 3 && since > STAGE_EST[3]) {
    o.stage = 4; o.times[4] = S.clock; o.stageT = S.t;
    o.racks.forEach(r => setRackStatus(r, "live"));
    S.rep = clamp(S.rep + 4, 0, 100);

/* ---------------- simulation step ---------------- */
let ledClock = 0, ledTick = 0;
function simulate(dt) {
  S.t += dt; S.clock += dt;
  // incidents
  if (S.t > S.nextIncident) { spawnIncident(); S.nextIncident = S.t + rand(9, 16); }
  for (const inc of S.incidents) {
    if (!inc.breached && inc.state !== "repairing" && S.t - inc.t0 > SLA) {
      inc.breached = true; inc.sev = "bad"; inc.pin.userData.mat.color.setHex(SEV.bad);
      S.uptime = Math.max(99.5, S.uptime - 0.004); S.rep = clamp(S.rep - 6, 0, 100); S.breaches++;
      toast(`SLA missed on ${inc.rack.id}. Uptime and reputation took a hit.`, "bad");
    }
  }
  // crews
  for (const c of crews) {
    if (c.state === "route" && walk(c, dt)) {
      const inc = c.job; c.state = "repair"; c.workT = 0;
      const sp = SPARES[inc.type.part];
      inc.usedSpare = sp.qty > 0; if (inc.usedSpare) sp.qty--;
      c.workDur = inc.usedSpare ? 5 : 10; inc.state = "repairing";
      c.g.rotation.y = inc.rack.row.f > 0 ? Math.PI : 0;
    } else if (c.state === "repair") {
      c.workT += dt;
      if (c.workT >= c.workDur) {
        resolve(c.job); c.job = null;
        const next = S.incidents.filter(i => i.queued && i.state === "open").sort((a, b) => a.t0 - b.t0)[0];
        if (next) assign(c, next);
        else {
          c.state = "return";
          const z = c.g.position.z;
          c.path = [{ x: LANE_X, z }, { x: LANE_X, z: c.home.z }, { x: c.home.x, z: c.home.z }];
        }
      }
    } else if (c.state === "return" && walk(c, dt)) { c.state = "idle"; c.g.rotation.y = -Math.PI / 2; }
  }
  tickOrder();
  truck.update(dt);
  // economy & telemetry
  let earning = 0, load = 0;
  for (const r of racks) {
    if (r.status !== "live") continue;
    const k = r.incident?.key;
    const f = k === "node" ? 0 : k === "psu" ? 0.5 : 1;
    earning += f; load += r.kw * (k === "node" ? 0.85 : 1);
  }
  S.revenueRate = earning * RACK_RATE;
  S.budget += S.revenueRate * dt;
  S.load = load / 1000;
  const hot = S.incidents.filter(i => i.key === "hot").length;
  S.pue += ((1.27 + hot * 0.035 + Math.sin(S.t / 7) * 0.01) - S.pue) * Math.min(1, dt * 0.8);
}

function updateLeds(dt) {
  ledClock += dt; if (ledClock < 0.14) return; ledClock = 0; ledTick++;
  const col = new THREE.Color();
  for (const r of racks) {
    for (let k = 0; k < LEDS_PER; k++) {
      let hex;
      if (r.status === "dark") hex = 0x3a4262;
      else if (r.status === "install") hex = (ledTick + k) % 4 === 0 ? 0x6f9bff : 0x24325e;
      else if (r.incident) {
        const bad = r.incident.sev === "bad";
        const on = (ledTick + (k % 2)) % 2 === 0;
        hex = k % 2 === 0 ? (on ? (bad ? 0xff4a4a : 0xffb020) : 0x3a1d22) : (bad ? 0xff6a5a : 0x35e39a);
      } else {
        hex = k % 2 === 0 ? (Math.random() < 0.08 ? 0x17573f : 0x35e39a) : (Math.random() < 0.3 ? 0x1d2e66 : 0x6f9bff);
      }

function rotateView(a) {

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "zoomin") { camera.zoom = clamp(camera.zoom * 1.25, controls.minZoom, controls.maxZoom); camera.updateProjectionMatrix(); }
  else if (a === "zoomout") { camera.zoom = clamp(camera.zoom / 1.25, controls.minZoom, controls.maxZoom); camera.updateProjectionMatrix(); }
  else if (a === "rotl") rotateView(Math.PI / 4);
  else if (a === "rotr") rotateView(-Math.PI / 4);
  else if (a === "home") { controls.reset(); select(null); }
  else if (a === "order") placeOrder();
  else if (a === "tab") { S.tab = el.dataset.tab; renderUI(true); }
  else if (a === "alerts") { S.tab = "alerts"; renderUI(true); }
  else if (a === "dispatch") { const inc = S.incidents.find(i => i.id === el.dataset.id); dispatch(inc); renderUI(true); }
  else if (a === "focus") { const r = rackById(el.dataset.rack); if (r) { select(r); flyTo(r.x, r.z, 2.1); } }
  else if (a === "crew") { const c = crews.find(c => c.id === el.dataset.id); if (c) flyTo(c.g.position.x, c.g.position.z, 2.1); }
  renderUI(true);
});

const search = $("#search");
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  if (e.key === "Escape") { select(null); search.blur(); }
});
search.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = search.value.trim().toUpperCase().replace(/^B[-\s]?/, "").replace(/\s/g, "");
  if (!q) return;
  const norm = /^[A-D]\d$/.test(q) ? q[0] + "0" + q[1] : q;
  const r = rackById(norm);
  if (r) { select(r); flyTo(r.x, r.z, 2.2); search.blur(); return; }
  if (/TRUCK|DEP|DELIVER/.test(q)) { const p = truck.g.visible ? truck.g.position : new THREE.Vector3(DOCK_X, 0, DOCK_Z); flyTo(p.x, p.z, 1.6); return; }
  const c = crews.find(c => c.id.replace("-", "") === q.replace("-", "") || c.name.toUpperCase().startsWith(q));
  if (c) { flyTo(c.g.position.x, c.g.position.z, 2.1); return; }
  if (/CHILL|COOL/.test(q)) { flyTo(23.5, -4.5, 1.6); return; }
  if (/GEN|POWER|SUB/.test(q)) { flyTo(-20.5, 1.2, 1.6); return; }
  toast(`No match for "${search.value}". Try a rack like D03, a crew like T-01, or "truck".`);
});

/* ---------------- UI rendering ---------------- */
function setHTML(el, html) { if (el._h !== html) { el._h = html; el.innerHTML = html; } }
const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;
const bar = (pct, cls = "") => `<div class="bar ${cls}"><i style="width:${clamp(pct, 0, 100).toFixed(0)}%"></i></div>`;
let uiClock = 0;
function renderUI(force) {
  const live = liveRacks().length, total = racks.length, open = S.incidents.length;
  const busy = crews.filter(c => c.state !== "idle").length;
  $("#clock").textContent = hhmm(S.clock);
  $("#siteSub").textContent = `${Math.round(live / total * 100)}% full · ${busy}/2 crews busy`;
  const badge = $("#bellBadge"); badge.hidden = !open; badge.textContent = open;

  setHTML($("#kpis"), [
    kpi("bolt", "IT load", S.load.toFixed(2), "MW", `of 2.00 MW utility feed`, null),
    kpi("gauge", "PUE", S.pue.toFixed(2), "", "facility ÷ IT power", S.pue > 1.33 ? ["↑ cooling strain", true] : ["on target", false]),
    kpi("shield", "Uptime", S.uptime.toFixed(3) + "%", "", "last 30 days", S.breaches ? [`${S.breaches} SLA miss${S.breaches > 1 ? "es" : ""}`, true] : null),
    kpi("wallet", "Budget", money(S.budget), "", `+${money(S.revenueRate * 60)} per hour`, null),
  ].join(""));

  const degraded = S.incidents.some(i => i.sev === "bad");
  setHTML($("#statusLine"), `${chip(degraded ? "bad" : open ? "warn" : "good", degraded ? "Degraded" : open ? "Attention" : "Operational")}
    <span>${live} racks live · ${open} open alert${open === 1 ? "" : "s"} · ${S.resolved} fixed today</span>`);
  const repCls = S.rep > 60 ? "good" : S.rep > 35 ? "warn" : "bad";
  setHTML($("#tiles"), `
    <div class="tile"><label>Racks live</label><div class="v">${live} <small>/ ${total}</small></div>${bar(live / total * 100)}</div>
    <div class="tile"><label>Power draw</label><div class="v">${S.load.toFixed(2)} <small>/ 2.00 MW</small></div>${bar(S.load / 2 * 100, S.load > 1.7 ? "warn" : "")}</div>
    <div class="tile"><label>Chillers</label><div class="v">6 <small>/ 6 running</small></div>${bar(55 + (S.pue - 1.25) * 300, S.pue > 1.33 ? "warn" : "good")}</div>
    <div class="tile"><label>Reputation</label><div class="v">${Math.round(S.rep)} <small>/ 100</small></div>${bar(S.rep, repCls)}</div>`);

  const r = S.selected;
  setHTML($("#rackCard"), r ? `<div class="selected-rack">
      <div class="top"><div><div class="eyebrow">Hall B · Row ${r.row.n}</div><b>${r.id}</b></div>${rackChip(r)}</div>
      ${r.status === "live" ? `<div class="kv"><div><label>Inlet</label><span>${r.inlet.toFixed(1)}°C</span></div><div><label>Draw</label><span>${r.kw.toFixed(1)} kW</span></div><div><label>Nodes</label><span>${r.incident?.key === "node" ? "5/6" : "6/6"}</span></div></div>` : `<p style="margin:0;color:var(--muted);font-size:11.5px">${r.status === "dark" ? "Empty position. Order racks below to fill it." : "Crew is mounting and cabling this rack."}</p>`}
      ${r.incident ? (r.incident.state === "open" ? `<button class="btn primary" data-act="dispatch" data-id="${r.incident.id}">${ICON.wrench} Send a technician</button>` : `<p style="margin:0;font-size:11.5px;color:var(--muted)">${r.incident.crew.name} (${r.incident.crew.id}) is ${r.incident.state === "repairing" ? "repairing it" : "on the way"}.</p>`) : ""}
    </div>` : "");

  setHTML($("#spares"), Object.values(SPARES).map(s => {
    const st = s.qty === 0 ? chip("bad", "Out") : s.qty < s.low ? chip("warn", "Low stock") : chip("good", "In stock");
    return `<div class="li"><span class="part-ico">${ICON[s.icon]}</span><span class="grow">${s.name}</span><span class="qty">${s.qty}</span><span style="width:74px;text-align:right">${st}</span></div>`;
  }).join(""));

  renderDeploy();
  renderOps();
}
function kpi(icon, label, val, unit, sub, delta) {
  return `<div class="kpi panel"><div class="ico">${ICON[icon]}</div><div><label>${label}</label>
    <div class="val">${val}${unit ? ` <small>${unit}</small>` : ""}${delta ? ` <span class="delta ${delta[1] ? "down" : ""}">${delta[0]}</span>` : ""}</div>
    <div class="sub">${sub}</div></div></div>`;
}
function rackChip(r) {
  if (r.status === "dark") return chip("idle", "Empty");
  if (r.status === "install") return chip("info", "Racking");
  if (r.incident) return chip(r.incident.sev, r.incident.type.label);
  return chip("good", "Healthy");
}
function renderDeploy() {
  const o = S.order || S.lastOrder;
  const dark = racks.filter(r => r.status === "dark").length;
  let nodes, head, card;
  if (o) {
    let t = o.times[o.stage];
    nodes = STAGES.map((s, i) => {
      const cls = i < o.stage || o.stage === 4 ? "done" : i === o.stage ? "now" : "";
      if (i > o.stage) t += STAGE_EST[i - 1];
      const when = o.times[i] != null ? hhmm(o.times[i]) : "ETA " + hhmm(t);
      return `<div class="stage-node ${cls}"><div class="dot">${ICON[s.icon]}</div><b>${s.label}</b><small>${when}</small></div>`;
    }).join("");
    head = `<b>${ICON.truck} Rack deployment</b><span class="mono">${o.id} · DCB Logistics</span>`;
    const stageChip = o.stage === 4 ? chip("good", "Live") : chip("info", STAGES[o.stage].label);
    card = `<div class="oid">#${o.id}</div><p>4 × GPU racks → Hall B, Row ${o.racks[0].row.n}</p><div>${stageChip}</div>`;
  } else {
    nodes = STAGES.map(s => `<div class="stage-node"><div class="dot">${ICON[s.icon]}</div><b>${s.label}</b><small>–</small></div>`).join("");
    head = `<b>${ICON.truck} Rack deployment</b><span>No delivery in progress</span>`;
    card = `<div class="oid">Next order</div><p>${dark ? `4 × GPU racks for ${dark} empty positions in Hall B. Each live rack earns ${money(RACK_RATE * 60)} per hour.` : "Hall B is full. Every position is earning."}</p>`;
  }
  const can = !S.order && dark >= 4;
  const label = S.order ? "Delivery in progress" : dark < 4 ? "Hall B is full" : `Order 4 racks · ${money(ORDER_COST)}`;
  card += `<button class="btn ${can && S.budget >= ORDER_COST ? "primary" : "ghost"}" data-act="order" ${can ? "" : "disabled"}>${label}</button>`;
  setHTML($("#deploy"), `<div class="track"><div class="track-head">${head}</div><div class="stages">${nodes}</div></div><div class="order-card">${card}</div>`);
}
function renderOps() {
  const open = S.incidents.length;
  const busy = crews.filter(c => c.state !== "idle").length;
  const tabs = [["alerts", "Alerts", open], ["rows", "Rows", ROWS.length], ["crew", "Crews", busy + "/2"]];
  setHTML($("#tabs"), tabs.map(([k, l, n]) => `<button class="tab ${k === "alerts" && open ? "alert" : ""}" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-tab="${k}">${l}<em>${n}</em></button>`).join("") + `<span class="spacer"></span><span>Hall B</span>`);
  let html = "";
  if (S.tab === "alerts") {
    html = open ? S.incidents.slice().sort((a, b) => (b.sev === "bad") - (a.sev === "bad") || a.t0 - b.t0).map(i => {
      const action = i.state === "open"
        ? (i.queued ? chip("idle", "Queued") : `<button class="btn primary sm" data-act="dispatch" data-id="${i.id}">Send tech</button>`)
        : chip("info", i.state === "repairing" ? `${i.crew.id} fixing` : `${i.crew.id} en route`);
      return `<div class="li"><span class="id" style="cursor:pointer" data-act="focus" data-rack="${i.rack.id}">${i.rack.id}</span>
        <span class="grow"><b style="color:${i.sev === "bad" ? "var(--bad)" : "var(--warn)"}">${i.type.label}</b><span class="sub">${i.detail} · ${i.breached ? "SLA missed" : "fix by " + hhmm(i.clock0 + SLA)}</span></span>${action}</div>`;
    }).join("") : `<div class="empty">No open alerts. Every rack is healthy.</div>`;
  } else if (S.tab === "rows") {
    html = ROWS.map(r => {
      const rs = racks.filter(x => x.row === r), lv = rs.filter(x => x.status === "live").length, inst = rs.filter(x => x.status === "install").length;
      const st = inst ? chip("info", "Racking") : lv === rs.length ? chip("good", "Full") : lv ? chip("warn", "Partial") : chip("idle", "Empty");
      return `<div class="li"><span class="id">Row ${r.n}</span><span class="grow">${lv}/${rs.length} live<span class="sub">${rs.filter(x => x.incident).length} alert${rs.filter(x => x.incident).length === 1 ? "" : "s"}</span></span><span class="mini-bar">${bar(lv / rs.length * 100)}</span>${st}</div>`;
    }).join("");
  } else {
    html = crews.map(c => {
      const label = { idle: "Idle at base", route: `Driving to ${c.job?.rack.id}`, repair: `Repairing ${c.job?.rack.id}`, return: "Returning to base" }[c.state];
      const pct = c.state === "repair" ? Math.round(c.workT / c.workDur * 10) * 10 : 0;
      const st = c.state === "idle" ? chip("good", "Available") : c.state === "repair" ? chip("warn", "Working") : chip("info", "Moving");
      return `<div class="li" style="cursor:pointer" data-act="crew" data-id="${c.id}"><span class="crew-av" style="background:${c.css}">${c.initials}</span><span class="grow"><b>${c.name}</b> <span class="mono" style="color:var(--muted)">${c.id}</span><span class="sub">${label}</span></span>${c.state === "repair" ? `<span class="mini-bar">${bar(pct, "warn")}</span>` : ""}${st}</div>`;
    }).join("");
  }
  setHTML($("#opsBody"), html);
}

/* ---------------- loop ---------------- */
// open on a working morning: one delivery already rolling and one alert waiting
placeOrder();
S.order.stage = 1; S.order.times[1] = S.clock; S.order.times[0] = S.clock - 6; truck.start(-46);
S.budget = 360000;
spawnIncident("hot");
S.nextIncident = 10;

const clockT = new THREE.Clock();
function frame() {
  const dt = Math.min(clockT.getDelta(), 0.1);
  simulate(dt);
  updateLeds(dt);
  if (!REDUCED) fans.forEach((f, i) => f.rotation.y += dt * (5 + (i % 3)));
  const now = performance.now() / 1000;
  for (const inc of S.incidents) {
    const s = 1.3 + (inc.state === "open" && !REDUCED ? Math.sin(now * 5) * 0.06 : 0);
    inc.pin.position.y = 2.4 + (REDUCED ? 0 : Math.sin(now * 2.4 + inc.rack.x) * 0.15);
    inc.pin.scale.setScalar(s);
  }
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 0.7);
    const k = ease(camAnim.t);
    controls.target.lerpVectors(camAnim.from, camAnim.to, k);
    camera.position.copy(controls.target).add(camAnim.offset);
    camera.zoom = camAnim.z0 + (camAnim.z1 - camAnim.z0) * k; camera.updateProjectionMatrix();
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  uiClock += dt;
  if (uiClock > 0.25) { uiClock = 0; renderUI(); }
  requestAnimationFrame(frame);
}
renderUI(true);
requestAnimationFrame(frame);
})();
</script>
