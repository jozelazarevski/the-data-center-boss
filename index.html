<title>The Data Center Boss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed isometric campus with glass cards floating on its edges: mission on the right,
   build bar along the bottom, lesson card above it. Phones stack everything under the map.
   Deliberately a single light, daylight look like a scale model on a desk. */
:root {
  color-scheme: light;
  --bg: #e9edf7;
  --panel: rgba(255, 255, 255, 0.95);
  --panel-solid: #ffffff;
  --ink: #121a33;
  --muted: #646e88;
  --faint: #a3abc0;
  --line: #e4e8f2;
  --wash: #f3f5fb;
  --accent: #2f5bea;
  --accent-ink: #1f45c7;
  --accent-wash: #e8eeff;
  --good: #16935f;
  --good-wash: #e2f6ec;
  --warn: #b7780a;
  --warn-wash: #fdf1d6;
  --bad: #d23f45;
  --bad-wash: #fde7e7;
  --shadow: 0 1px 2px rgba(18, 26, 51, 0.06), 0 8px 24px rgba(30, 50, 110, 0.10);
  --font-ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 500 13px/1.45 var(--font-ui); font-variant-numeric: tabular-nums;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }
.mono { font-family: var(--font-data); font-weight: 500; letter-spacing: -0.01em; }
.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; white-space: nowrap; }
.levels { display: flex; align-items: center; gap: 4px; margin-left: 8px; min-width: 0; overflow-x: auto; }
.lvl { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--faint); white-space: nowrap; }
.lvl i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; background: var(--wash); color: var(--faint); border: 1.5px solid #dfe4f0; }
.lvl.done { color: var(--good); }
.lvl.done i { background: var(--good); border-color: var(--good); color: #fff; }
.lvl.now { color: var(--ink); background: var(--accent-wash); }
.lvl.now i { background: var(--accent); border-color: var(--accent); color: #fff; }
.lvl-sep { width: 14px; height: 1.5px; background: #dfe4f0; flex: none; }
.spacer { flex: 1; }
.money { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
.money b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.money small { font-size: 11px; color: var(--good); font-weight: 700; }
.live { display: flex; align-items: center; gap: 6px; background: var(--good-wash); color: var(--good); border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 12px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(22,147,95,.18); }
.live span { color: var(--ink); font-family: var(--font-data); }
.live.outage { background: var(--bad-wash); color: var(--bad); }
.live.outage i { background: var(--bad); box-shadow: 0 0 0 3px rgba(210,63,69,.18); }
.bell { position: relative; border: 0; background: transparent; padding: 6px; border-radius: 8px; }
.bell:hover { background: var(--wash); }
.badge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; line-height: 16px; text-align: center; }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1; min-height: 0; }
.canvas-wrap { position: absolute; inset: 0; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.pointing { cursor: pointer; }
.panel { background: var(--panel); border: 1px solid rgba(255,255,255,.7); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(10px); }

.kpis { position: absolute; top: 16px; left: 16px; display: flex; gap: 10px; scrollbar-width: thin; z-index: 2; max-width: calc(100% - 440px); overflow-x: auto; padding-bottom: 4px; }
.kpi { display: flex; align-items: center; gap: 10px; padding: 10px 13px 10px 10px; min-width: 150px; flex: none; }
.kpi .ico, .ico-tile { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-wash); color: var(--accent); display: grid; place-items: center; flex: none; }
.kpi.warn .ico { background: var(--warn-wash); color: var(--warn); }
.kpi.bad .ico { background: var(--bad-wash); color: var(--bad); }
.kpi label { display: block; font-size: 11.5px; font-weight: 600; }
.kpi .val { display: flex; align-items: baseline; gap: 5px; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.kpi .val small { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.kpi .sub { font-size: 10.5px; color: var(--muted); white-space: nowrap; }

.mapctl { position: absolute; top: 16px; right: 392px; z-index: 2; display: flex; flex-direction: column; padding: 4px; gap: 2px; }
.mapctl button { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; }
.mapctl button:hover { background: var(--wash); }
.mapctl hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }

.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--panel-solid); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 11px; min-width: 170px; max-width: 250px; font-size: 12px; border: 1px solid var(--line); }
.tip b { font-size: 12.5px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
.tip .row span:last-child { color: var(--ink); font-weight: 700; }
.tip p { margin: 4px 0 0; color: var(--muted); }
.tip .hint { margin-top: 6px; color: var(--accent); font-weight: 700; }

.toasts { position: absolute; z-index: 6; top: 92px; left: 50%; transform: translateX(-62%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { display: flex; align-items: center; gap: 9px; background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 14px 8px 10px; font-weight: 600; font-size: 12.5px; box-shadow: var(--shadow); animation: tin .25s ease-out; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: #6f8cff; flex: none; }
.toast.good i { background: #3ddc97; } .toast.warn i { background: #f7b733; } .toast.bad i { background: #ff6b6b; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }

/* ---------- side panel ---------- */
.side { position: absolute; top: 16px; right: 16px; width: 360px; z-index: 2; bottom: 16px; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; align-items: center; gap: 4px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 12px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--panel-solid); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(18,26,51,.08); }
.tab em { font-style: normal; color: var(--faint); margin-left: 3px; }
.tab.alert em { color: var(--bad); }
.side-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.mission-head h2 { margin: 2px 0 4px; font-size: 18px; letter-spacing: -0.02em; text-wrap: balance; }
.mission-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.tierline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.chip.good { background: var(--good-wash); color: var(--good); }
.chip.warn { background: var(--warn-wash); color: var(--warn); }
.chip.bad { background: var(--bad-wash); color: var(--bad); }
.chip.info { background: var(--accent-wash); color: var(--accent-ink); }
.chip.idle { background: var(--wash); color: var(--muted); }
.next { background: var(--accent); color: #fff; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.next .eyebrow { color: rgba(255,255,255,.75); }
.next p { margin: 0; font-size: 12.5px; }
.next .btn { align-self: flex-start; background: #fff; color: var(--accent-ink); }
.next.done { background: var(--good); }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 12px; margin-bottom: 4px; }
.sec-title span { font-weight: 600; color: var(--muted); font-size: 11px; }
.obj { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); }
.obj:last-child { border-bottom: 0; }
.check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #cfd6e6; display: grid; place-items: center; flex: none; margin-top: 1px; color: #fff; }
.obj.done .check { background: var(--good); border-color: var(--good); }
.obj.done .obj-label { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(100,110,136,.4); }
.obj .grow { flex: 1; min-width: 0; }
.obj-label { font-weight: 600; }
.obj small { display: block; color: var(--muted); font-size: 11px; }
.drill { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--wash); }
.drill + .drill { margin-top: 6px; }
.drill .grow { flex: 1; min-width: 0; }
.drill b { display: block; font-size: 12.5px; }
.drill small { color: var(--muted); font-size: 11px; display: block; }
.btn { border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { background: var(--accent-wash); color: var(--accent-ink); }
.btn.ghost:hover { background: #dbe4ff; }
.btn:disabled { background: var(--wash); color: var(--faint); cursor: not-allowed; }
.btn.sm { padding: 5px 9px; font-size: 11px; border-radius: 7px; }
.btn.lg { padding: 10px 16px; font-size: 13px; }
.li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .id { font-family: var(--font-data); font-weight: 600; width: 46px; flex: none; }
.li .sub { color: var(--muted); font-size: 11px; display: block; }
.empty { color: var(--muted); font-size: 12px; padding: 14px 0; text-align: center; }
.hb { border-bottom: 1px solid var(--line); }
.hb summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 9px 0; cursor: pointer; font-weight: 700; }
.hb summary::-webkit-details-marker { display: none; }
.hb summary small { margin-left: auto; color: var(--faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.hb .lesson-body { padding: 0 0 12px 36px; }
.part-ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent); flex: none; }
.note { font-size: 11px; color: var(--muted); margin: 0; }

/* ---------- lesson content ---------- */
.lesson-body h4 { margin: 10px 0 2px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lesson-body h4:first-child { margin-top: 0; }
.lesson-body p { margin: 0; font-size: 12.5px; max-width: 62ch; }
.lesson-body ul { margin: 2px 0 0; padding-left: 16px; font-size: 12.5px; }
.lesson-body li { margin: 1px 0; }

/* ---------- lesson card & build bar ---------- */
.lesson { position: absolute; left: 16px; bottom: 212px; width: 420px; max-height: calc(100% - 330px); min-height: 120px; overflow-y: auto; z-index: 3; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.lesson-top { display: flex; gap: 11px; align-items: flex-start; }
.lesson-top h3 { margin: 1px 0 0; font-size: 16px; letter-spacing: -0.01em; }
.lesson-top .x { margin-left: auto; border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 4px; }
.lesson-top .x:hover { background: var(--wash); color: var(--ink); }
.specs { display: flex; gap: 6px; flex-wrap: wrap; }
.lesson-foot { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.lesson-foot .why { flex: 1 1 160px; font-size: 11.5px; color: var(--bad); font-weight: 600; min-width: 0; }
.lesson-foot .why.ok { color: var(--muted); font-weight: 500; }

.build { position: absolute; left: 16px; right: 392px; bottom: 16px; z-index: 2; padding: 10px 12px 12px; }
.build-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.build-head b { font-size: 13px; margin-right: 6px; }
.cat { border: 0; border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; background: var(--wash); color: var(--muted); }
.cat[aria-pressed="true"] { background: var(--ink); color: #fff; }
.cards { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 4px; scroll-snap-type: x proximity; }
.bcard { flex: none; width: 158px; text-align: left; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 12px; padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; scroll-snap-align: start; position: relative; }
.bcard:hover { border-color: #c8d3f5; }
.bcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.bcard .top { display: flex; align-items: center; justify-content: space-between; }
.bcard b { font-size: 12.5px; line-height: 1.25; }
.bcard small { color: var(--muted); font-size: 11px; }
.bcard .cost { font-weight: 800; font-size: 12px; }
.bcard .st { font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bcard .st.ok { color: var(--good); } .bcard .st.no { color: var(--warn); } .bcard .st.lock { color: var(--faint); }
.bcard.locked { background: var(--wash); }
.bcard.locked b, .bcard.locked .cost { color: var(--faint); }
.bcard.locked .part-ico { background: #e9ecf4; color: var(--faint); }
.bcard.hint::after { content: "Next"; position: absolute; top: -8px; right: 8px; background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 800; border-radius: 5px; padding: 1px 6px; letter-spacing: .04em; text-transform: uppercase; }
.bcard.hint { border-color: var(--accent); animation: hintpulse 1.6s ease-in-out infinite; }
@keyframes hintpulse { 50% { box-shadow: 0 0 0 4px rgba(47,91,234,.18); } }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(18, 26, 51, 0.28); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel-solid); border-radius: 18px; box-shadow: 0 20px 60px rgba(18,26,51,.25); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { margin: 2px 0 0; font-size: 22px; letter-spacing: -0.02em; text-wrap: balance; }
.modal .lead { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 62ch; }
.modal .result { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; }
.modal .result.pass { background: var(--good-wash); }
.modal .result.fail { background: var(--bad-wash); }
.modal .result .ico-tile { background: #fff; }
.modal .result.pass .ico-tile { color: var(--good); }
.modal .result.fail .ico-tile { color: var(--bad); }
.modal .result p { margin: 2px 0 0; }
.modal .concept { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.learned { margin: 0; padding-left: 18px; }
.learned li { margin: 3px 0; }

/* ---------- brands, options, choices ---------- */
.vtag { display: inline-flex; align-items: center; border-radius: 5px; padding: 1px 6px; font-size: 10px; font-weight: 800; letter-spacing: .03em; background: var(--wash); color: var(--muted); white-space: nowrap; vertical-align: middle; }
.vtag.jci { background: #e3f1ff; color: #0b5cad; }
.bcard .row2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
.cat.jcicat { color: #0b5cad; }
.cat.jcicat[aria-pressed="true"] { background: #0b5cad; color: #fff; }
.money small.neg { color: var(--bad); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--panel-solid); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: #f7f9ff; }
.opt .opt-top { display: flex; justify-content: space-between; align-items: center; }
.opt b { font-size: 12.5px; }
.opt small { color: var(--muted); font-size: 11.5px; }
.opt .cost { font-weight: 800; font-size: 12px; }
.obj .btn { flex: none; align-self: center; }
.obj .bar, .lesson .bar { margin-top: 5px; }
.bar { height: 5px; border-radius: 3px; background: #dfe4f0; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .3s linear; }
.hb summary .vtag { margin-left: 4px; }
.modal.wide { width: min(980px, 100%); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.choice { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.choice h3 { margin: 2px 0 0; font-size: 15px; }
.choice dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: 11.5px; }
.choice dt { color: var(--muted); }
.choice dd { margin: 0; font-weight: 600; }
.choice p, .choice ul { margin: 0; font-size: 11.5px; }
.choice ul { padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.choice .pro { color: var(--good); font-weight: 600; }
.choice .con { color: var(--bad); font-weight: 600; }
.choice .btn { margin-top: auto; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .side { width: 320px; }
  .mapctl { right: 352px; }
  .build { right: 352px; }
  .kpis { max-width: calc(100% - 400px); }
  .levels .lvl span { display: none; }
  .lvl { padding: 5px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .topbar { flex-wrap: wrap; gap: 10px; }
  .levels { order: 5; flex-basis: 100%; margin-left: 0; }
  .stage { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px; }
  .canvas-wrap { position: relative; inset: auto; height: 56vh; min-height: 360px; margin: 0 -16px; }
  .kpis { top: 12px; left: 12px; right: 12px; max-width: none; }
  .kpi { min-width: 142px; padding: 8px 11px 8px 8px; }
  .kpi .ico { width: 30px; height: 30px; }
  .kpi .val { font-size: 16px; }
  .mapctl { top: auto; bottom: 12px; right: 12px; flex-direction: row; }
  .mapctl hr { border-top: 0; border-left: 1px solid var(--line); margin: 4px 3px; }
  .side, .build, .lesson { position: static; width: auto; max-height: none; }
  .side { order: 3; }
  .build { order: 1; }
  .lesson { order: 2; }
  .side-body { overflow: visible; }
  .toasts { top: 64px; transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .bcard.hint, .toast { animation: none; }
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><span id="logo"></span>Data Center Boss</div>
    <nav class="levels" id="levels" aria-label="Levels"></nav>
    <div class="spacer"></div>
    <div class="money"><b id="budget">$0</b><small id="rate">+$0/h</small></div>
    <div class="live" id="live"><i></i><span style="font-family:inherit;color:inherit" id="liveText">Grid</span> <span id="clock">09:00</span></div>
    <button class="bell" data-act="alerts" aria-label="Show alerts"><span data-icon="bell"></span><span class="badge" id="bellBadge" hidden>0</span></button>
  </header>

  <main class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="scene" aria-label="Isometric view of your data center. Hover equipment to learn what it is; click an alert pin to send a technician."></canvas>
      <section class="kpis" id="kpis" aria-label="Key figures"></section>

function computeCaps() {
  const cm = n("containment") ? 1.25 : 1, bc = bld().cool;
  const utilityCap = n("substation") ? 2500 : n("transformer") ? 300 : n("utility") ? 50 : 0;
  const ups = n("upsSmall") * 20 + n("ups") * 500;
  const upsBig = n("ups") ? 500 : n("upsSmall") ? 20 : 0;
  const gen = n("gen") * 500;

function walk(c, dt) {
  if (!c.path.length) return true;
  const p = c.path[0], pos = c.g.position;
  const dx = p.x - pos.x, dz = p.z - pos.z, d = Math.hypot(dx, dz), s = 2.8 * dt;
  if (d > 0.001) c.g.rotation.y = Math.atan2(dx, dz);
  if (d <= s) { pos.x = p.x; pos.z = p.z; c.path.shift(); } else { pos.x += dx / d * s; pos.z += dz / d * s; }
  return c.path.length === 0;
}

/* =====================================================================

function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.innerHTML = "<i></i><span></span>"; el.lastChild.textContent = text;
  const box = $("#toasts"); box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  setTimeout(() => el.remove(), 4500);
}
function learn(key) { if (!S.learned.includes(key)) S.learned.push(key); }

function build(k) {
  const b = blocker(k);
  if (b) { toast(b.why + ".", "warn"); return; }
  const it = ITEMS[k], pick = S.choice[k] ?? 0, cost = costOf(k);
  S.budget -= cost;
  if (it.options) (S.picks[k] = S.picks[k] || []).push(pick);
  if (k === "rack" || k === "gpu") {
    const r = (k === "rack" ? RACK_ORDER : GPU_ORDER).find(r => !r.built);
    r.built = true; popIn(r.mesh); showRackLeds(r);
    if (k === "gpu") S.built.gpu = n("gpu") + 1;
    toast(`${r.id} installed: ${r.kw} kW in row ${r.row.n}.`, "good");
  } else {
    const g = SLOTS[k][n(k)];
    S.built[k] = n(k) + 1;
    popIn(g);
    if (k === "gen" && n("gen") === 1) { genPad.visible = true; popIn(fuelTank); }
    if (k === "chiller" && n("chiller") === 1) chillerPad.visible = true;
    toast(`${it.options ? it.options[pick].name : it.name} installed.`, "good");
  }
  learn(k);
  if (k === "split" || k === "crac") learn("pue");
  invalidate();
  if (S.level >= 2 && cost >= 20000) truck.start();
  renderAll();
  checkLevel();
}

function startProc(k) {
  const p = PROCS[k];
  if (p.modal) { learn(k); if (p.modal === "site") showSiteModal(); else if (procBlocker(k)?.needProc) toast(procBlocker(k).why + ".", "warn"); else showBuildingModal(); return; }
  const b = procBlocker(k);
  if (b) { toast(b.why + ".", "warn"); return; }
  S.budget -= procCost(k);
  S.tasks[k] = { t: 0, dur: procDur(k), done: false };
  learn(k);
  if (k === "cx13" || k === "cx45") learn("cx");
  toast(`${p.name} started.`);
  renderAll();
}
function tickTasks(dt) {
  for (const k in S.tasks) {
    const t = S.tasks[k]; if (t.done) continue;
    t.t += dt;
    if (t.t >= t.dur) { t.done = true; toast(`${PROCS[k].name}: done.`, "good"); invalidate(); renderAll(); checkLevel(); }
  }
}
function chooseSite(key) {
  if (S.site) return;
  S.site = key; learn("site"); closeModal();
  toast(`You're building in ${SITES[key].name}.`, "good");
  renderAll(); checkLevel();
}
function buyBuilding(key) {
  if (S.building) return;
  const b = BUILDINGS[key], cost = Math.round(b.cost * site().land / 1000) * 1000;
  if (S.budget < cost) { toast(`That costs ${money(cost)}. You have ${money(S.budget)}.`, "warn"); return; }
  S.budget -= cost; S.building = key; learn("building");

let ledClock = 0, ledTick = 0;
function simulate(dt) {
  S.t += dt; S.clock += dt;
  const c = C();
  // economics: customers pay per kW of IT; the utility bills facility power (IT × PUE)
  const down = S.drill && !S.drill.result.ok && S.drill.t > 0.8;
  S.rev = down ? 0 : c.it * 16 * site().rev;
  S.bill = c.facility * c.price * 60;
  S.rate = S.rev - S.bill;
  S.budget += S.rate * dt;
  tickTasks(dt);
  if (S.level >= 2 && S.t > S.nextIncident && !S.drill) { spawnIncident(); S.nextIncident = S.t + rand(22, 34); }
  for (const inc of S.incidents) if (!inc.breached && inc.state !== "repairing" && S.t - inc.t0 > SLA()) {
    inc.breached = true; inc.sev = "bad"; inc.pin.userData.mat.color.setHex(SEV.bad); S.uptime = Math.max(95, S.uptime - 0.01);
    toast(`${inc.rack.id} waited too long. Uptime took a hit.`, "bad");
  }
  for (const cr of crews) {
    if (cr.state === "route" && walk(cr, dt)) { cr.state = "repair"; cr.workT = 0; cr.job.state = "repairing"; cr.g.rotation.y = cr.job.rack.row.f > 0 ? Math.PI : 0; }
    else if (cr.state === "repair") {
      cr.workT += dt;
      if (cr.workT >= 5) {
        resolve(cr.job); cr.job = null;
        const next = S.incidents.find(i => i.queued && i.state === "open");
        if (next) assign(cr, next);
        else { cr.state = "return"; const z = cr.g.position.z; cr.path = [{ x: LANE_X, z }, { x: LANE_X, z: cr.home.z }, { x: cr.home.x, z: cr.home.z }]; }
      }
    } else if (cr.state === "return" && walk(cr, dt)) { cr.state = "idle"; cr.g.rotation.y = -Math.PI / 2; }
  }
  truck.update(dt);
  if (S.drill) {
    S.drill.t += dt;
    const d = DRILLS[S.drill.key];
    const k = d.power ? Math.sin(Math.min(1, S.drill.t / S.drill.dur) * Math.PI) : 0;
    const dark = d.power ? (S.drill.result.ok ? k * 0.35 : k * 0.75) : 0;
    hemi.intensity = 0.62 - dark * 0.45; sun.intensity = 0.58 - dark * 0.4;
    scene.background.copy(SKY).lerp(SKY_DARK, dark);
    if (d.power && S.drill.result.ok) genGroups.forEach((g, i) => { if (i < n("gen")) g.position.y = Math.sin(S.t * 60 + i) * 0.03 * k; });
    if (S.drill.t >= S.drill.dur) { hemi.intensity = 0.62; sun.intensity = 0.58; scene.background.copy(SKY); genGroups.forEach(g => g.position.y = 0); finishDrill(); }
  }
}
function updateLeds(dt) {
  ledClock += dt; if (ledClock < 0.14) return; ledClock = 0; ledTick++;
  const col = new THREE.Color();
  const d = S.drill, dead = d && !d.result.ok && d.t > 0.8;
  for (const r of racks) {
    if (!r.built) continue;
    for (let k = 0; k < LEDS_PER; k++) {

      if (dead) hex = d.key === "fiberCut" ? (k % 2 ? 0xffb020 : 0x35e39a) : d.key === "chillerFail" ? ((ledTick + k) % 2 ? 0xff4a4a : 0x3a1d22) : 0x262b3d;
      else if (r.incident) { const bad = r.incident.sev === "bad", on = (ledTick + (k % 2)) % 2 === 0; hex = k % 2 === 0 ? (on ? (bad ? 0xff4a4a : 0xffb020) : 0x3a1d22) : 0x35e39a; }

      else hex = k % 2 === 0 ? (Math.random() < 0.08 ? 0x17573f : 0x35e39a) : (Math.random() < 0.3 ? 0x1d2e66 : 0x6f9bff);

}

function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function hit(e) {

  ray.setFromCamera(ndc, camera);

  const targets = [...pins, ...racks.filter(r => r.built).map(r => r.mesh), ...INFO.filter(visibleChain)];
  const h = ray.intersectObjects(targets, false)[0];

  }
  const b = blocker(k);
  if (!b || b.lock) return { kind: "item", key: k };
  if (b.needProc) { const a = actionFor("proc", b.needProc, depth + 1); if (!a) return { kind: "item", key: k }; return a.wait ? a : { ...a, why: `${ITEMS[k].name}: ${lc(b.why)}.` }; }
  if (b.money) return { kind: "item", key: k, why: "You're saving up for it; your racks earn while you wait." };
  if (b.need && b.need !== k) { const a = actionFor("item", b.need, depth + 1); return a && !a.wait && !a.why ? { ...a, why: `${ITEMS[k].name}: ${lc(b.why)}.` } : a; }
  return { kind: "item", key: k, why: b.why + "." };
}
function nextHint() {
  const L = LEVELS[S.level];
  let waiting = null;
  const objs = objList(L), buildDone = objs.filter(o => !o.drill && !(o.proc && DRILL_GATES.has(o.proc))).every(objDone);
  for (const o of objs) {
    if (objDone(o)) continue;
    let a;
    if (o.drill && !buildDone) continue; // test only once the build is finished
    if (o.drill) {
      const d = DRILLS[o.drill];
      if (d.needs && !procDone(d.needs)) a = actionFor("proc", d.needs);
      else {
        // if the design would fail and the player already saw it fail, point at the fix instead
        const r = d.test(C());
        a = !r.ok && r.fix && S.failed?.[o.drill] && ITEMS[r.fix] && !blocker(r.fix)?.lock ? { ...(actionFor("item", r.fix) || {}), why: r.text } : { kind: "drill", key: o.drill };
      }
    }
    else if (o.proc) a = actionFor("proc", o.proc);
    else a = actionFor("item", typeof o.hint === "function" ? o.hint() : o.hint);
    if (!a) continue;
    if (a.wait) { waiting = waiting || a.wait; continue; }
    const why = a.why ? esc(a.why) + " " : "";
    if (a.kind === "drill") return { ...a, text: `Everything's in place. Run the <b>${DRILLS[a.key].name.toLowerCase()}</b> drill to prove your design works.`, label: "Run drill" };
    if (a.kind === "proc") return { ...a, text: `${why}Next: <b>${PROCS[a.key].name}</b>, toward “${esc(o.label)}”.`, label: PROCS[a.key].modal ? "Open" : "Read and start" };
    const nm = ITEMS[a.key].name, art = /^[AEIOU]/i.test(nm) ? "an" : "a";
    return { ...a, text: `${why}Build ${art} <b>${nm}</b> to work toward “${esc(o.label)}”.`, label: `Show ${nm}` };
  }
  if (waiting) return { text: `Waiting for <b>${PROCS[waiting].name}</b> to finish. Real projects run several of these in parallel.` };
  return null;
}

function renderAll() {
  invalidate();
  const c = C();
  const L = LEVELS[S.level];
  setHTML($("#levels"), LEVELS.map((l, i) => {

    kpi("gauge", "PUE", c.pue ? c.pue.toFixed(2) : "–", "", c.pue ? (c.pue >= 1.8 ? "closet-grade" : c.pue >= 1.45 ? "enterprise-grade" : c.pue > 1.25 ? "efficient" : "hyperscale-grade") : "facility ÷ IT power", ""),
    kpi("wallet", "Profit", S.rev ? (S.rate < 0 ? "−" : "") + money(Math.abs(S.rate * 60)) : "–", S.rev ? "/h" : "", S.rev ? `revenue ${money(S.rev * 60)} − power ${money(S.bill * 60)}` : `power ${S.site ? "$" + c.price.toFixed(3) + "/kWh" : "price set by location"}`, S.rate < 0 ? "bad" : ""),
  ].join(""));

  setHTML($("#buildHead"), `<b>Build</b>` + CATS.map(k => `<button class="cat ${k === "JCI" ? "jcicat" : ""}" data-act="cat" data-cat="${k}" aria-pressed="${S.cat === k}">${k}</button>`).join(""));
  const hint = S.completed ? null : nextHint();
  setHTML($("#cards"), ORDER.filter(k => catMatch(k, S.cat)).map(k => {
    const it = ITEMS[k], b = blocker(k), lockLvl = it.level > S.level;
    const count = k === "rack" ? `${rackCount()}/${LEVELS[S.level].rackCap}` : it.max > 1 ? `${n(k)}/${it.max}` : "";
    const st = lockLvl ? `<span class="st lock">Level ${it.level}</span>` : !b ? `<span class="st ok">Ready</span>`
      : b.built ? `<span class="st lock">Built</span>` : b.lock ? `<span class="st lock">Full</span>` : b.money ? `<span class="st no">Saving up</span>`
      : `<span class="st no" title="${esc(b.why)}">Needs ${b.needProc ? PROCS[b.needProc].short : b.need ? ITEMS[b.need].name.toLowerCase() : "more"}</span>`;
    return `<button class="bcard ${lockLvl ? "locked" : ""} ${hint?.kind === "item" && hint.key === k ? "hint" : ""}" data-act="item" data-k="${k}" aria-pressed="${S.selected === k}">
      <span class="top"><span class="part-ico">${ICON[it.icon]}</span><span class="cost">${it.options ? "from " : ""}${money(it.options ? Math.min(...it.options.map((_, i) => costOf(k, i))) : costOf(k))}</span></span>
      <b>${it.name}</b><small>${it.spec}${count ? " · " + count : ""}</small><span class="row2">${brandTag(k)}${st}</span></button>`;
  }).join(""));

  renderLesson();
  const lessonEl = $("#lesson"), buildEl = document.querySelector(".build");

  else { lessonEl.style.bottom = ""; lessonEl.style.maxHeight = ""; }
  renderSide(c, L, hint, open);
  document.querySelectorAll("[data-prog]").forEach(el => { const t = S.tasks[el.dataset.prog]; el.style.width = t ? Math.min(100, t.t / t.dur * 100) + "%" : "0"; });
}
function renderLesson() {

    setHTML(lesson, `<div class="lesson-top"><span class="part-ico">${ICON[it.icon]}</span><div><div class="eyebrow">${it.cat} · Level ${it.level} · ${brandTag(k)}</div><h3>${it.name}</h3></div><button class="x" data-act="closeLesson" aria-label="Close lesson">${ICON.x}</button></div>
      <div class="specs">${chip("info", it.spec)}${it.max > 1 ? chip("idle", `${n(k)} of ${it.max} built`) : ""}</div>

      <div class="lesson-foot"><span class="why ${b ? "" : "ok"}" id="lessonWhy"></span>${needBtn}
      <button class="btn primary" data-act="build" data-k="${k}" ${b ? "disabled" : ""}>Build · ${money(costOf(k))}</button></div>`);

function renderSide(c, L, hint, open) {
  setHTML($("#tabs"), [["mission", "Mission", ""], ["handbook", "Handbook", S.learned.length], ["alerts", "Alerts", S.level >= 2 ? open : ""]]
    .map(([k, l, nn]) => `<button class="tab ${k === "alerts" && open ? "alert" : ""}" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-tab="${k}">${l}${nn !== "" ? `<em>${nn}</em>` : ""}</button>`).join(""));

    const objs = objList(L), doneCount = objs.filter(objDone).length;

      <div class="tierline">${chip("info", L.tier)}${chip(doneCount === objs.length ? "good" : "idle", `${doneCount}/${objs.length} goals`)}${S.site ? chip("idle", site().name) : ""}${S.building ? chip("idle", bld().name) : ""}${L.n >= 2 ? chip(S.uptime >= 99.9 ? "good" : "warn", `Uptime ${S.uptime.toFixed(2)}%`) : ""}</div></div>`;
    if (S.completed) side += `<div class="next done"><div class="eyebrow">Campus complete</div><p>You've finished every level. Keep the campus running: fix alerts, add capacity and rerun any drill.</p></div>`;
    else if (hint) side += `<div class="next"><div class="eyebrow">Next step</div><p>${hint.text}</p>${hint.label ? `<button class="btn" data-act="hintGo" ${hint.kind === "drill" && S.drill ? "disabled" : ""}>${hint.label}</button>` : ""}</div>`;
    side += `<div><div class="sec-title">Goals <span>${L.tier}</span></div>${objs.map(o => {
      const d = objDone(o); let sub = "", extra = "";
      if (o.prog) { const [a, b] = o.prog(); sub = `${Math.min(a, b)} / ${b}${o.unit ? " " + o.unit : ""}`; }
      if (o.sub && !d) sub = o.sub();
      if (o.proc && !d) {
        if (procRunning(o.proc)) { sub = "In progress"; extra = `<div class="bar"><i data-prog="${o.proc}"></i></div>`; }
        else sub = `Process${procCost(o.proc) ? " · " + money(procCost(o.proc)) : ""}${procDur(o.proc) ? " · " + procDur(o.proc) + " s" : ""}`;
      }
      const btn = o.proc && !d && !procRunning(o.proc) ? `<button class="btn ghost sm" data-act="proc" data-k="${o.proc}">${PROCS[o.proc].modal ? "Open" : "Details"}</button>` : "";
      return `<div class="obj ${d ? "done" : ""}"><span class="check">${d ? ICON.check : ""}</span><span class="grow"><span class="obj-label">${esc(o.label)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}${extra}</span>${btn}</div>`;
    }).join("")}</div>`;
    const drills = S.completed ? Object.keys(DRILLS) : objs.filter(o => o.drill).map(o => o.drill);
    if (drills.length) side += `<div><div class="sec-title">Failure drills <span>test your design</span></div>${drills.map(k => {
      const d = DRILLS[k], gated = d.needs && !procDone(d.needs);
      return `<div class="drill"><span class="part-ico">${ICON[d.icon]}</span><span class="grow"><b>${d.name}</b><small>${gated ? `Needs ${PROCS[d.needs].name.toLowerCase()}` : d.desc}</small></span>${S.passed[k] ? chip("good", "Passed") : ""}<button class="btn ${S.passed[k] ? "ghost" : "primary"} sm" data-act="drill" data-k="${k}" ${S.drill || gated ? "disabled" : ""}>${ICON.play} ${S.passed[k] ? "Rerun" : "Run"}</button></div>`;
    }).join("")}</div>`;
  } else if (S.tab === "handbook") {
    side += `<p class="note">Everything you've built, done or met so far, newest first.</p>`;
    side += `<div>${S.learned.slice().reverse().map(k => {
      const x = ITEMS[k] || CONCEPTS[k] || PROCS[k] || (k === "cx" ? CX : null); if (!x) return "";
      const kind = ITEMS[k] ? `${ITEMS[k].cat}` : PROCS[k] ? "Process" : "Key idea";
      const extra = ITEMS[k]?.options ? `<div class="lesson-body" style="padding-top:0"><h4>Products</h4><ul>${ITEMS[k].options.map(o => `<li><b>${o.name}</b> (${o.jci ? "JCI" : "non-JCI"}): ${esc(o.note)}</li>`).join("")}</ul></div>` : "";
      return `<details class="hb"><summary><span class="part-ico">${ICON[x.icon]}</span><span>${x.name}</span>${ITEMS[k] ? brandTag(k) : ""}<small>${kind}</small></summary>${lessonBody(x)}${extra}</details>`;
    }).join("")}</div>`;
    side += `<p class="note">Figures are illustrative and simplified for play. Product names are used for education; this game is not affiliated with Johnson Controls or any other vendor.</p>`;
  } else {
    if (S.level < 2) side += `<div class="empty">Alerts start at level 2, when technicians join your site.</div>`;
    else {
      side += open ? `<div>${S.incidents.map(i => `<div class="li"><span class="id">${i.rack.id}</span><span class="grow"><b style="color:${i.sev === "bad" ? "var(--bad)" : "var(--warn)"}">${i.type.label}</b><span class="sub">${esc(i.detail)}</span></span>${i.state === "open" ? (i.queued ? chip("idle", "Queued") : `<button class="btn primary sm" data-act="dispatch" data-id="${i.id}">Send tech</button>`) : chip("info", i.state === "repairing" ? `${i.crew.id} fixing` : `${i.crew.id} en route`)}</div>`).join("")}</div>`
        : `<div class="empty">No open alerts. Every rack is healthy.</div>`;
      side += `<div><div class="sec-title">Technicians <span>${n("bms") ? `BMS on: ${SLA()} s to respond` : `${SLA()} s to respond`}</span></div>${crews.map(cr => `<div class="li"><span class="part-ico" style="background:${cr.css};color:#fff;border-radius:50%;font-size:9.5px;font-weight:800">${cr.initials}</span><span class="grow"><b>${cr.name}</b><span class="sub">${{ idle: "Available", route: `Heading to ${cr.job?.rack.id}`, repair: `Fixing ${cr.job?.rack.id}`, return: "Returning" }[cr.state]}</span></span></div>`).join("")}</div>`;
    }
  }
  setHTML($("#sideBody"), side);
}
const CX = { name: "Commissioning levels", icon: "check2",
  what: "A staged process that proves a data center works: L1 factory tests, L2 installation checks, L3 start-up, L4 functional tests, L5 integrated systems test.",
  why: "Each level catches a different kind of mistake. Customers expect to see the L5 results before moving in.",
  nums: ["Led by an independent commissioning agent", "Every test follows a written procedure", "Open issues are tracked to closure"] };
function kpi(icon, label, val, unit, sub, cls) {
  return `<div class="kpi panel ${cls}"><div class="ico">${ICON[icon]}</div><div><label>${label}</label><div class="val">${val}${unit ? ` <small>${unit}</small>` : ""}</div><div class="sub">${sub}</div></div></div>`;
}

/* =====================================================================
   LOOP
   ===================================================================== */
const clockT = new THREE.Clock();
let uiClock = 0;
function frame() {
  const dt = Math.min(clockT.getDelta(), 0.1);
  simulate(dt);
  updateLeds(dt);
  tickPops(dt);
  const chillerDown = S.drill?.key === "chillerFail";
  if (!REDUCED) fans.forEach((f, i) => { if (!(chillerDown && i < 2)) f.rotation.y += dt * (5 + (i % 3)); });
  const now = performance.now() / 1000;
  for (const inc of S.incidents) inc.pin.position.y = 2.4 + (REDUCED ? 0 : Math.sin(now * 2.4 + inc.rack.x) * 0.15);
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 0.9);
    const k = ease(camAnim.t);
    controls.target.lerpVectors(camAnim.from, camAnim.to, k);
    camera.position.copy(controls.target).add(camAnim.offset);
    camera.zoom = camAnim.z0 + (camAnim.z1 - camAnim.z0) * k; camera.updateProjectionMatrix();
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  uiClock += dt;
  if (uiClock > 0.3) { uiClock = 0; renderAll(); }
  requestAnimationFrame(frame);
}
startLevel(0);
requestAnimationFrame(frame);
})();
